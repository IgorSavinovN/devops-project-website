stages:
  - build
  - push

variables:
  DOCKER_IMAGE: igorsavinon/devops-project-website
  DOCKER_TAG: latest

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG .
  artifacts:
    paths:
      - ./

push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
  only:
    - main
