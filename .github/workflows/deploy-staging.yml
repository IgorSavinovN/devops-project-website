name: Deploy staging to Docker

on:
  push:
    branches: [ staging ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: yourusername/flask-staging:latest

      - name: Redeploy container on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 155.212.165.190
          username: igor
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull yourusername/flask-staging:latest
            docker stop devops_flask_staging || true
            docker rm devops_flask_staging || true
            docker run -d --name devops_flask_staging -p 8001:8000 --network devops-network -e DATABASE_URL=postgresql://igor:password@devops_postgres_staging/devopsdb yourusername/flask-staging:latest