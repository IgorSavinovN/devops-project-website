apiVersion: v1
kind: Service
metadata:
  name: {{ include "flask-chart.fullname" . }}-svc
  labels:
    app: {{ .Values.appName }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ .Values.appName }}
