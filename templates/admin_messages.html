{% extends "base.html" %}

{% block content %}
<h1>📨 Сообщения с формы</h1>

<table class="admin-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Email</th>
            <th>Сообщение</th>
            <th>Дата</th>
        </tr>
    </thead>
    <tbody>
        {% for msg in messages %}
        <tr>
            <td>{{ msg.id }}</td>
            <td>{{ msg.name }}</td>
            <td><a href="mailto:{{ msg.email }}">{{ msg.email }}</a></td>
            <td>{{ msg.message }}</td>
            <td>{{ msg.created_at.strftime('%d.%m.%Y %H:%M') }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5">Нет сообщений</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
